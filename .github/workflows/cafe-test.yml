name: Cafe API Test

on:
  workflow_dispatch:
    inputs:
      access_token:
        description: '직접 넣을 access_token (비우면 refresh 사용)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install
        run: pip install requests
      
      - name: Test Cafe Write
        env:
          CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.NAVER_REFRESH_TOKEN }}
          INPUT_TOKEN: ${{ inputs.access_token }}
        run: |
          python <<'EOF'
          import os, requests, urllib.parse
          
          CLUB_ID = "31767633"
          MENU_ID = "16"
          
          input_token = os.environ.get("INPUT_TOKEN", "").strip()
          
          if input_token:
              print("=== USING PROVIDED ACCESS TOKEN ===")
              access_token = input_token
          else:
              # refresh_token으로 access_token 발급 (POST 방식)
              refresh_token = os.environ["REFRESH_TOKEN"].strip()
              print(f"=== REFRESH TOKEN LENGTH: {len(refresh_token)} ===")
              print(f"=== FIRST 10 CHARS: {refresh_token[:10]} ===")
              print(f"=== LAST 10 CHARS: {refresh_token[-10:] } ===")
              
              r = requests.post(
                  "https://nid.naver.com/oauth2.0/token",
                  data={
                      "grant_type": "refresh_token",
                      "client_id": os.environ["CLIENT_ID"].strip(),
                      "client_secret": os.environ["CLIENT_SECRET"].strip(),
                      "refresh_token": refresh_token,
                  },
                  headers={"Content-Type": "application/x-www-form-urlencoded"}
              )
              print("=== TOKEN REFRESH ===")
              print("Status:", r.status_code)
              print("Response:", r.text)
              
              j = r.json()
              if "access_token" not in j:
                  print("❌ access_token 발급 실패")
                  exit(1)
              access_token = j["access_token"]
              print(f"✅ access_token 획득: {access_token[:20]}...")
          
          # 카페 글쓰기
          print("\n=== CAFE WRITE ===")
          res = requests.post(
              f"https://openapi.naver.com/v1/cafe/{CLUB_ID}/menu/{MENU_ID}/articles",
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
              },
              data=f"subject={urllib.parse.quote('Econbot 테스트')}&content={urllib.parse.quote('API 연동 테스트')}&openyn=true",
          )
          print("Status:", res.status_code)
          print("Response:", res.text)
          EOF
